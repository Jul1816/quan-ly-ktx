# Cấu hình tối ưu cho Ứng dụng Quản lý Ký túc xá Sinh viên (Streamlit)
# Bám sát quy chuẩn Streamlit và bảng màu ứng dụng (#1E3A8A)

[server]
port = 8501
headless = false
runOnSave = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
base = "light"
primaryColor = "#1E3A8A"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans serif"
showWidgetBorder = true
